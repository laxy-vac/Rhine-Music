name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
# Portable/native/hardware validation requires separately prepared local tools.
# This workflow does not publish artifacts, call devices or use a personal library.
