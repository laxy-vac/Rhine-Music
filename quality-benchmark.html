<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Quality Benchmark</title>
    <style>
      html, body, main { box-sizing: border-box; width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #07111f; }
      #benchmark-scene { position: relative; width: 100%; height: 100%; overflow: hidden; background: #07111f; }
      #benchmark-scene canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    </style>
    <script type="module">
      const emptyStorage = Object.freeze({
        get length() { return 0; },
        key() { return null; },
        getItem() { return null; },
        setItem() { throw new Error("Benchmark storage is read-only."); },
        removeItem() { throw new Error("Benchmark storage is read-only."); },
        clear() { throw new Error("Benchmark storage is read-only."); },
      });
      try {
        Object.defineProperty(window, "localStorage", { configurable: false, value: emptyStorage });
        Object.defineProperty(window, "sessionStorage", { configurable: false, value: emptyStorage });
      } catch (error) {
        document.body.textContent = "Storage isolation is unavailable; benchmark stopped.";
        throw new Error("Storage isolation is unavailable; benchmark stopped.", { cause: error });
      }

      const guardUrl = value => {
        const input = typeof Request !== "undefined" && value instanceof Request ? value.url : String(value);
        const url = new URL(input, location.href);
        if (url.protocol === "data:" || url.protocol === "blob:") return url;
        if (url.origin !== location.origin || /\/(?:api|audio)(?:\/|$)/i.test(url.pathname) ||
            /\.(?:mp3|m4a|aac|flac|wav|aiff|dsf|dff|ogg|opus)(?:$|\?)/i.test(url.pathname))
          throw new Error("Benchmark blocked a non-static, API, or audio request.");
        return url;
      };
      if (typeof window.fetch === "function") {
        const nativeFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
          try { guardUrl(input); }
          catch (error) { return Promise.reject(error); }
          return nativeFetch(input, init);
        };
      }
      const NativeXhr = window.XMLHttpRequest;
      window.XMLHttpRequest = class extends NativeXhr {
        open(method, url, async = true, username = null, password = null) {
          guardUrl(url);
          return super.open(method, url, async, username, password);
        }
      };

      await import("./src/quality-benchmark-frame.ts");
    </script>
  </head>
  <body>
    <main id="benchmark-scene" aria-label="Synthetic quality benchmark scene"></main>
  </body>
</html>
